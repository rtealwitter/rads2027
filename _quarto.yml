project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - syllabus.qmd
    - "topics/*/reading.qmd"
  post-render:
    - python3 tools/post_render.py
  resources:
    - CNAME
    - favicon.ico
    - "topics/*/problems/*.pdf"
    - "topics/*/problems/*.py"
    - "topics/*/problems/images/*"
    - "slides/*.pdf"
    - "project/*.pdf"

format:
  html:
    theme: [cosmo, custom_theme.scss]
    css: styles.css
    toc: false
    include-in-header: header.html
    page-layout: full
    math: mathjax

website:
  site-url: https://rads.rtealwitter.com
  favicon: favicon.ico
  navbar:    
    css: styles.css
    title: "{{< var term >}}"
    search: false
    left:
      - text: "Discord"
        href: "{{< var discord_url >}}"
      - text: "Gradescope"
        href: "{{< var gradescope_url >}}"
      - text: "Syllabus"
        href: syllabus.html
